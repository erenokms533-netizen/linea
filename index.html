<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linea AI</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6c6c70;
    --rule: #e3e3e6; --accent: #7a5a3a; --box: #f6f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131313; --fg: #ececec; --muted: #9a9a9e;
      --rule: #2c2c2e; --accent: #c9a37a; --box: #1c1b1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 18vh 22px 80px; max-width: 34rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 2.1rem; margin: 0 0 .1em; letter-spacing: -.01em; }
  .tag { color: var(--muted); margin: 0 0 2.6em; }
  a.row {
    display: block; padding: 16px 18px; margin-bottom: 10px;
    background: var(--box); border-radius: 12px;
    color: var(--fg); text-decoration: none;
  }
  a.row:hover { outline: 1.5px solid var(--accent); }
  a.row strong { color: var(--accent); font-weight: 600; }
  a.row span { display: block; color: var(--muted); font-size: .9rem; margin-top: 2px; }
  footer { margin-top: 3em; color: var(--muted); font-size: .88rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<h1>Linea AI</h1>
<p class="tag">Keep the passages you mark in the books you read.<br>Okuduğun kitaplarda işaretlediğin yerleri sakla.</p>

<a class="row" href="gizlilik.html">
  <strong>Privacy Policy</strong>
  <span>Gizlilik Politikası</span>
</a>

<a class="row" href="kullanim-kosullari.html">
  <strong>Terms of Use</strong>
  <span>Kullanım Koşulları</span>
</a>

<footer>
  <p>Support / Destek: <a href="mailto:[[İLETİŞİM E-POSTASI]]">[[İLETİŞİM E-POSTASI]]</a></p>
</footer>

</body>
</html>
